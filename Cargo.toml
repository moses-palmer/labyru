[workspace.package]
version = "3.2.0"
authors = ["Moses Palmér <mosespalmer@gmail.com>"]
edition = "2024"

[workspace.dependencies]
actix-web = "4.11"
bit-set = "0.8"
clap = { version = "4.5", features = [ "cargo", "derive" ] }
fastrand = "2.3"
futures-util = "0.3"
image = "0.25"
lazy_static = "1.5"
rand = "0.9"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
svg = "0.18"

[workspace]
resolver = "2"
members = [
    "maze",
    "maker",
    "test",
    "tools",
    "web",
]

[profile.bench]
debug = true
